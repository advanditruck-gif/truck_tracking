<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae39d"/>
      <stop offset="50%" stop-color="#e8ca78"/>
      <stop offset="100%" stop-color="#b8933b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(232, 202, 120, 0.22)"/>
      <stop offset="100%" stop-color="rgba(232, 202, 120, 0)"/>
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e8ca78" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Golden Emblem Container -->
  <g filter="url(#badgeShadow)">
    <rect x="88" y="88" width="336" height="336" rx="72" fill="url(#goldGrad)"/>
    <rect x="89" y="89" width="334" height="334" rx="71" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Truck Outline Icon inside Gold Emblem -->
  <g transform="translate(148, 156)" fill="none" stroke="#15120c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cargo Box -->
    <rect x="10" y="20" width="130" height="110" rx="12" fill="#15120c" fill-opacity="0.08"/>
    <!-- Cab -->
    <path d="M140 50 h42 l24 38 v42 h-66 z" fill="#15120c" fill-opacity="0.08"/>
    <!-- Cab Window -->
    <path d="M148 60 h28 l18 28 h-46 z" fill="#fae39d" stroke-width="10"/>
    <!-- Chassis Link -->
    <line x1="20" y1="130" x2="200" y2="130" stroke-width="14"/>
    <!-- Wheels -->
    <circle cx="56" cy="144" r="22" fill="#15120c" stroke="#fae39d" stroke-width="10"/>
    <circle cx="168" cy="144" r="22" fill="#15120c" stroke="#fae39d" stroke-width="10"/>
  </g>

  <!-- Subtle Brand Wordmark Accent -->
  <text x="256" y="468" text-anchor="middle" fill="#d4be79" font-family="'Lora', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4">AD VANDI</text>
</svg>
