<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080c16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ad Vandi">
    <meta name="application-name" content="Ad Vandi">
    <title>Ad Vandi — Reports</title>

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=14) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='report.css', v=15) }}">
</head>

<body>
    <main class="report-main">
        <header class="top">
            <button class="rep-folder-toggle" type="button" aria-label="Open folders" aria-expanded="false"
                aria-controls="report-folders">
                <span></span><span></span><span></span>
            </button>
            <a class="brand" href="/" aria-label="Ad Vandi run log home">
                <img class="brand-logo" src="{{ url_for('static', filename='ad-vandi-logo.png', v=1) }}" alt="Ad Vandi run log">
            </a>
            <div class="top-right">
                <a class="report-link" href="/">Back to run log</a>
            </div>
        </header>

        <div id="app" class="report-app"></div>
    </main>
    <script src="{{ url_for('static', filename='report.js', v=16) }}"></script>
</body>

</html>
