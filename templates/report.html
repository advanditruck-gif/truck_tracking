<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080c16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ad Vandi">
    <meta name="application-name" content="Ad Vandi">
    <title>Ad Vandi — Reports</title>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .catch(error => console.warn('[PWA] SW register:', error));
        }
    </script>
    <script>
        (() => {
            try {
                const theme = localStorage.getItem('advandi-theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
            } catch (error) {
                console.warn('Could not read theme preference:', error);
            }
        })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=20) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='report.css', v=33) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css', v=3) }}">
</head>

<body>
    <main class="report-main">
        <header class="top">
            <button class="rep-folder-toggle" type="button" aria-label="Open folders" aria-expanded="false"
                aria-controls="report-folders">
                <span></span><span></span><span></span>
            </button>
            <a class="brand" href="/" aria-label="Ad Vandi run log home">
                <img class="brand-logo" src="{{ url_for('static', filename='ad-vandi-logo.png', v=1) }}" alt="Ad Vandi run log">
            </a>
            <div class="top-right">
                <a class="report-link" href="/">Back to run log</a>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
                    <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/></svg>
                    <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                </button>
            </div>
        </header>

        <div id="app" class="report-app"></div>
    </main>
    <div class="data-analyst-watermark" aria-hidden="true">
        <div class="watermark-title">Data Analyst Team</div>
        <div class="watermark-name">MAGNUS</div>
    </div>
    <script src="{{ url_for('static', filename='theme.js', v=1) }}"></script>
    <script src="{{ url_for('static', filename='report.js', v=44) }}"></script>
</body>

</html>
