<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080c16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ad Vandi">
    <meta name="application-name" content="Ad Vandi">
    <title>Ad Vandi</title>

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=14) }}">
</head>

<body>
    <main>
        <header class="top">
            <a class="brand" href="/" aria-label="Ad Vandi run log home">
                <img class="brand-logo" src="{{ url_for('static', filename='ad-vandi-logo.png', v=1) }}" alt="Ad Vandi run log">
            </a>
            <div class="top-right">
                <span id="offline-chip" class="chip offline-chip" hidden><i></i>Offline</span>
                <button id="install-btn" class="install-btn" type="button" aria-label="Install Ad Vandi App" hidden>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Install App</span>
                </button>
                <a class="report-link desktop-only" href="/report">Reports</a>
                <div id="status"></div>
            </div>
        </header>
        <div id="app"></div>
    </main>
    <div id="pwa-toast" class="pwa-toast" hidden role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js', v=27) }}"></script>
</body>

</html>
