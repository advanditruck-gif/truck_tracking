<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080c16">
    <meta name="description" content="Ad Vandi — Daily truck run tracker, location check-ins, visits, and fuel log.">
    <title>Ad Vandi</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <!-- iOS & Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ad Vandi">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=12) }}">
</head>

<body>
    <main>
        <header class="top">
            <a class="brand" href="/" aria-label="Ad Vandi run log home">
                <img class="brand-logo" src="{{ url_for('static', filename='ad-vandi-logo.png', v=1) }}" alt="Ad Vandi run log">
            </a>
            <div class="top-controls">
                <span class="chip chip-offline" id="offline-chip" hidden aria-live="polite"><i></i>Offline</span>
                <button type="button" class="chip chip-install" id="install-btn" hidden aria-label="Install Ad Vandi App">
                    <svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                    <span>Install</span>
                </button>
                <div id="status"></div>
            </div>
        </header>
        <div id="app"></div>
    </main>
    <div id="pwa-toast" class="pwa-toast" hidden role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js', v=21) }}"></script>
</body>

</html>
